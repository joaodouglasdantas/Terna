description = "Construtor de front do harness — o AUTOR do design, nao o critico. Modo P projeta o front no papel e entrega a secao Frontend/Interface da PRD Tecnica; Modo O ergue a tela no codigo no lugar do hefesto quando a task e de interface; Modo R corrige os achados de UX do michelangelo."
model_reasoning_effort = "medium"
