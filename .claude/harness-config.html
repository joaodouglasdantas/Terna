<!doctype html>
<!-- .claude/harness-config.html (3.5.3) — PAINEL DO ECOSSISTEMA DO HARNESS.
     Aba ECONOMIA (3.0.0): modo de delegacao, fallback, verbosidade e a tabela de
     roteamento por papel. Os tres dials tem DESTINO escolhivel — 'maquina' grava
     em .claude/harness.env.local (gitignored, nao viaja no /deus) e 'projeto' em
     .claude/harness.env. O .local continua FORA da allowlist de arquivo da tela;
     a fresta e por CHAVE (ENV_LOCAL_CHAVES no harness-ui.mjs), para que segredo
     por maquina (ex. HARNESS_PRESENCE_TOKEN) nunca chegue ao browser.
     Template VERSIONADO: so o /deus o atualiza; nao edite num projeto-alvo.

     Dois modos, detectados no boot:
       BRIDGE  — servido por `node .claude/harness-ui.mjs`. Le o estado real via
                 /api/state e GRAVA direto nos arquivos (edicao cirurgica, com backup).
       LEITURA — aberto direto (file:// ou Apache), sem o bridge. Cai no fluxo
                 classico: preencher e copiar a config p/ o Claude aplicar.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness — painel do projeto</title>
<style>
  :root{
    --navy:#0e2c52; --ciano:#1ba9e2; --magenta:#b066a4;
    --bg:#f4f6f9; --card:#fff; --line:#e2e8f0; --text:#1b2733; --muted:#64748b; --sub:#fafbfc;
    --ok:#16a34a; --warn:#d97706; --erro:#dc2626;
    --radius:12px; --shadow:0 1px 3px rgba(14,44,82,.08),0 6px 20px rgba(14,44,82,.06);
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0f1720; --card:#161f2b; --line:#26323f; --text:#e6edf5; --muted:#94a3b8; --sub:#1b2634; }
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
  header{background:linear-gradient(120deg,var(--navy),#163a68);color:#fff;padding:16px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{margin:0;font-size:17px;font-weight:650}
  header .sub{font-size:12.5px;opacity:.82}
  header .spacer{flex:1}
  .pill{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:4px 11px;font-size:11.5px;white-space:nowrap}
  .pill.alerta{background:rgba(220,38,38,.35);border-color:rgba(255,180,180,.5)}
  .pill.ok{background:rgba(22,163,74,.32);border-color:rgba(150,240,180,.45)}
  nav{background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:2px;padding:0 14px;overflow-x:auto;position:sticky;top:0;z-index:4}
  nav button{background:none;border:none;border-bottom:2px solid transparent;padding:11px 14px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;font-family:inherit}
  nav button:hover{color:var(--text)}
  nav button.on{color:var(--ciano);border-bottom-color:var(--ciano)}
  nav button .n{background:var(--line);color:var(--muted);border-radius:999px;padding:1px 6px;font-size:10.5px;margin-left:5px}
  .wrap{max-width:1140px;margin:0 auto;padding:18px 16px 96px}
  .aba{display:none} .aba.on{display:block}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin:14px 0;overflow:hidden}
  .card > h2{margin:0;padding:12px 16px;font-size:13.5px;font-weight:650;background:var(--sub);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .card .body{padding:14px 16px}
  .hint{color:var(--muted);font-size:12.5px;margin:0 0 12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
  .full{grid-column:1/-1}
  label{display:block;font-size:12.5px;font-weight:600;margin-bottom:4px}
  input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;background:var(--card);color:var(--text)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ciano);box-shadow:0 0 0 3px rgba(27,169,226,.16)}
  textarea{min-height:96px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
  .sujo{border-color:var(--magenta)!important;box-shadow:0 0 0 3px rgba(176,102,164,.14)}
  /* status/tiles */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .tile{background:var(--sub);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
  .tile .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .tile .v{font-size:16px;font-weight:650;margin-top:2px;word-break:break-word}
  .tile.click{cursor:pointer} .tile.click:hover{border-color:var(--ciano)}
  /* presets */
  .presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
  .preset{border:2px solid var(--line);border-radius:10px;padding:13px;cursor:pointer;background:var(--card)}
  .preset:hover{border-color:var(--ciano)}
  .preset.active{border-color:var(--ciano);background:rgba(27,169,226,.07)}
  .preset.maximo.active{border-color:var(--magenta);background:rgba(176,102,164,.08)}
  .preset.economico.active{border-color:var(--ok);background:rgba(22,163,74,.07)}
  .preset h3{margin:0 0 3px;font-size:14px} .preset .tag{font-size:11px;color:var(--muted)}
  .preset ul{margin:7px 0 0;padding-left:16px;font-size:11.5px;color:var(--muted)}
  table.m{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px}
  table.m th,table.m td{border:1px solid var(--line);padding:5px 8px;text-align:center}
  table.m th:first-child,table.m td:first-child{text-align:left}
  table.m thead th{background:var(--sub)}
  table.m td.hl{font-weight:700;color:var(--magenta)}
  /* listas de itens (skills/agentes/hooks/convencoes) */
  .itens{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .item{border:1px solid var(--line);border-radius:10px;padding:12px 13px;background:var(--card)}
  .item h4{margin:0 0 3px;font-size:13.5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .item p{margin:5px 0 0;font-size:12px;color:var(--muted)}
  .item .rodape{margin-top:9px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--muted)}
  .tag{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--line);color:var(--muted)}
  .tag.nucleo{background:rgba(27,169,226,.16);color:var(--ciano)}
  .tag.local{background:rgba(176,102,164,.16);color:var(--magenta)}
  .tag.ok{background:rgba(22,163,74,.16);color:var(--ok)}
  .tag.warn{background:rgba(217,119,6,.18);color:var(--warn)}
  .tag.erro{background:rgba(220,38,38,.16);color:var(--erro)}
  .aviso{border-left:3px solid var(--warn);background:rgba(217,119,6,.08);padding:9px 12px;border-radius:0 8px 8px 0;font-size:12.5px;margin:8px 0}
  .aviso.erro{border-color:var(--erro);background:rgba(220,38,38,.08)}
  .aviso.ok{border-color:var(--ok);background:rgba(22,163,74,.08)}
  /* flags */
  .flag{display:flex;align-items:flex-start;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
  .flag:last-child{border-bottom:none}
  .flag .txt{flex:1} .flag .txt b{font-size:12.5px;font-family:ui-monospace,Consolas,monospace}
  .flag .txt small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
  .flag select,.flag input{width:auto;min-width:120px}
  pre{background:var(--sub);border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;font-size:11.5px;max-height:460px;margin:0}
  code{background:var(--sub);padding:1px 5px;border-radius:4px;font-size:12px;font-family:ui-monospace,Consolas,monospace}
  /* acoes */
  .acoes{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:11px 16px;display:flex;gap:9px;align-items:center;justify-content:center;flex-wrap:wrap;z-index:6}
  button.b{font-family:inherit;font-size:13px;font-weight:600;border-radius:9px;padding:9px 15px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
  button.b:hover{border-color:var(--ciano)}
  button.b.primary{background:var(--ciano);border-color:var(--ciano);color:#fff}
  button.b.primary:disabled{opacity:.45;cursor:not-allowed}
  button.b.pequeno{padding:5px 10px;font-size:12px}
  .toast{position:fixed;bottom:66px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:9;max-width:90%}
  .toast.show{opacity:1}
  dialog{border:none;border-radius:12px;max-width:820px;width:92%;padding:0;background:var(--card);color:var(--text)}
  dialog .dlgb{padding:14px 16px}
  dialog textarea{min-height:320px}
  dialog::backdrop{background:rgba(0,0,0,.45)}
</style>
</head>

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
async function boot(){
  S.token = new URLSearchParams(location.search).get('t') || '';
  try {
    const r = await fetch('/api/state?t=' + encodeURIComponent(S.token), {cache:'no-store'});
    if (!r.ok) throw new Error('sem bridge');
    S.dados = await r.json();
    S.bridge = true;
  } catch {
    S.bridge = false;
    let inj = {};
    try { inj = JSON.parse($('harness-config-data').textContent) || {}; } catch { inj = {}; }
    S.dados = Object.assign({
      projeto:'(sem bridge)', versao:'', papel:'projeto', preset:'equilibrado', targets:'claude',
      perfilCampos:{}, perfilBlocos:{}, perfilFaltando:[], env:{}, envComentados:{},
      skills:[], agentes:[], hooks:[], convencoes:[], telemetria:null,
    }, inj);
  }
  S.preset = S.dados.preset || 'equilibrado';
  renderCabecalho(); renderNav(); renderTudo(); marcarSujo();
  // Puxa DTs/PRDs em segundo plano só para os tiles da Visão geral já virem
  // preenchidos — a aba em si continua sendo carregada sob demanda.
  carregarTrabalho(false);
}

function renderCabecalho(){
  const d = S.dados;
  $('hSub').innerHTML = `<b>${esc(d.projeto||'—')}</b>${d.raiz?` · <code style="background:rgba(255,255,255,.12);color:#fff">${esc(d.raiz)}</code>`:''}`;
  const m = $('pModo');
  m.textContent = S.bridge ? 'bridge ativo — salva direto' : 'somente leitura';
  m.className = 'pill ' + (S.bridge ? 'ok' : 'alerta');
  $('pVersao').textContent = 'harness ' + (d.versao || '—');
  $('pPapel').textContent = d.papel === 'mestre' ? 'cópia-mestre' : 'projeto';
}

function renderNav(){
  const d = S.dados;
  const cont = { skills:d.skills.length, agentes:d.agentes.length, hooks:d.hooks.length, convencoes:d.convencoes.length };
  $('nav').innerHTML = ABAS.map(([id,rot],i)=>
    `<button class="${i===0?'on':''}" data-aba="${id}" onclick="irPara('${id}')">${rot}${cont[id]!==undefined?`<span class="n">${cont[id]}</span>`:''}</button>`
  ).join('');
}
function irPara(id){
  document.querySelectorAll('.aba').forEach(e=>e.classList.remove('on'));
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on', b.dataset.aba===id));
  $('ab-'+id).classList.add('on');
  window.scrollTo({top:0,behavior:'smooth'});
  if (id === 'trabalho') carregarTrabalho(false);
  if (id === 'ideias') carregarIdeias();
}
function renderTudo(){ renderVisao(); renderTrabalho(); renderIdeias(); renderPerfil(); renderEsforco(); renderEconomia(); renderSkills(); renderAgentes(); renderHooks(); renderNoturno(); renderConvencoes(); }

  if (emRisco.length) avisos += `<div class="aviso"><b>${emRisco.length} agente(s) com CRLF</b> (sem o gatilho <code>": "</code>, então ainda carregam): ${emRisco.map(a=>esc(a.slug)).join(', ')}. Risco latente — normalize para LF.</div>`;

  if (vazios) avisos += `<div class="aviso">${vazios} campo(s) do Perfil ainda sem valor. Os subagentes leem o Perfil — campo vazio vira suposição.</div>`;

      ${d.telemetria.tipos.map(t=>`<tr><td>${esc(t.tipo)}</td><td>${t.n}</td><td>${t.minutos||'—'}</td><td>${t.tokens?t.tokens.toLocaleString('pt-BR'):'—'}</td><td>${t.ciclos||'—'}</td></tr>`).join('')}

function campoHtml(id, rotulo, exemplo, opcoes){

    return `<div><label>${esc(rotulo)}</label><select id="f_${id}" onchange="mudouCampo('${id}')">
      ${opcoes.map(o=>`<option value="${esc(o)}"${o===v?' selected':''}>${esc(o||'(vazio)')}</option>`).join('')}
      ${opcoes.includes(v)?'':`<option value="${esc(v)}" selected>${esc(v)}</option>`}
    </select></div>`;
  }
  return `<div><label>${esc(rotulo)}</label><input id="f_${id}" value="${esc(v)}" placeholder="${esc(exemplo||'')}" oninput="mudouCampo('${id}')"></div>`;
}

function valEconomia(k, def){
  // Precedencia da tela = a mesma dos hooks: .local vence o harness.env.
  if (S.sujo.envLocal[k] !== undefined) return S.sujo.envLocal[k];
  if (S.sujo.env[k] !== undefined) return S.sujo.env[k];
  const d = S.dados;
  if (d.envLocal && d.envLocal[k] !== undefined) return d.envLocal[k];
  if (d.env && d.env[k] !== undefined) return d.env[k];
  if (d.envResolvido && d.envResolvido[k] !== undefined) return d.envResolvido[k];   // 3.5.7: hooks/_defaults.env
  return def;
}
function origemEconomia(k){
  const d = S.dados;
  if (d.envLocal && d.envLocal[k] !== undefined) return 'máquina';
  if (d.env && d.env[k] !== undefined) return 'projeto';
  // 3.5.7: a origem resolvida pelas camadas (defaults do harness, ~/.harness.env.local, ambiente)
  const o = d.envOrigem && d.envOrigem[k];
  return o ? ({defaults:'default do harness', local:'máquina', maquina:'máquina', ambiente:'ambiente', projeto:'projeto'}[o] || o) : 'default';
}
function renderEconomia(){
  const d = S.dados;
  const modo = valEconomia('HARNESS_DELEGATE_MODE','off');
  const verb = valEconomia('HARNESS_VERBOSITY','conciso');
  const fb   = valEconomia('HARNESS_DELEGATE_FALLBACK','preset');
  const rota = d.roteamento || {};
  const semTabela = PAPEIS_ROTA.every(([p]) => !rota[p]);

  // O que o modo resolve por papel (espelha expandir_modo() do broker — se um dia
  // divergirem, o BROKER manda: e ele que a skill consulta via --rota).
  const doModo = (p) => {
    if (modo === 'apoio')  return ['discovery-schema','discovery-codigo','discovery-prds'].includes(p) ? 'codex-cli' : 'native';
    if (modo === 'economia') return ['michelangelo','dedalo','ariadne'].includes(p) ? 'native'
      : (['discovery-dts','discovery-schema','discovery-codigo','discovery-prds','inovacao','impacto','beholder'].includes(p) ? 'codex-cli' : 'native');
    return 'native';
  };
  const efetivo = (p) => {
    const r = rota[p];
    const v = r && r.executor && r.executor !== 'preset' && !r.executor.includes('<') ? r.executor : null;
    return v || doModo(p);
  };

  const linhas = PAPEIS_ROTA.map(([p, rot]) => {
    const r = rota[p] || {};
    const vE = S.sujo.roteamento[p]?.executor ?? (r.executor || 'preset');
    const vF = S.sujo.roteamento[p]?.fallback ?? (r.fallback || 'preset');
    const ef = efetivo(p);
    const tag = ef === 'native' ? '<span class="tag">nativo</span>'
      : (ef === 'off' ? '<span class="tag warn">não roda</span>' : `<span class="tag ok">${esc(ef)}</span>`);
    const trava = p === 'michelangelo';
    return `<tr>
      <td><b>${esc(p)}</b><br><small class="hint">${esc(rot)}</small></td>
      <td><select id="rt_e_${p}" onchange="mudouRota('${p}')"${trava?' disabled':''}>
        ${EXECUTORES.map(o=>`<option value="${o}"${o===vE?' selected':''}>${o}</option>`).join('')}</select></td>
      <td><select id="rt_f_${p}" onchange="mudouRota('${p}')"${trava?' disabled':''}>
        ${FALLBACKS.map(o=>`<option value="${o}"${o===vF?' selected':''}>${o}</option>`).join('')}</select></td>
      <td>${tag}</td></tr>`;
  }).join('');

  const nExternos = PAPEIS_ROTA.filter(([p]) => !['native','off'].includes(efetivo(p))).length;

  $('ab-economia').innerHTML = `
    <div class="card"><h2>Onde o trabalho roda</h2><div class="body">
      <p class="hint">O harness pode delegar mini-tasks <b>read-only</b> da <code>/prd</code> a um CLI externo já autenticado nesta máquina — <code>codex exec</code> ou <code>claude -p</code>. Sem API, sem chave. A síntese, o julgamento e a escrita <b>nunca</b> saem da sessão.</p>
      <div class="flag"><div class="txt"><b>Modo de delegação</b> <span class="tag">${esc(origemEconomia('HARNESS_DELEGATE_MODE'))}</span>
        <small>${esc((MODOS_DELEG.find(m=>m[0]===modo)||[])[1] || 'valor desconhecido')}</small></div>
        <select id="ec_modo" onchange="mudouEconomia('HARNESS_DELEGATE_MODE','ec_modo')">
          ${MODOS_DELEG.map(([v])=>`<option value="${v}"${v===modo?' selected':''}>${v}</option>`).join('')}</select></div>
      <div class="flag"><div class="txt"><b>Fallback quando o externo falha</b> <span class="tag">${esc(origemEconomia('HARNESS_DELEGATE_FALLBACK'))}</span>
        <small><code>preset</code> deriva do modo: <b>apoio</b> → volta ao nativo; <b>economia</b> → <b>pergunta</b> (voltar ao nativo devolveria o trabalho à conta que se está poupando).</small></div>
        <select id="ec_fb" onchange="mudouEconomia('HARNESS_DELEGATE_FALLBACK','ec_fb')">
          ${FALLBACKS.map(o=>`<option value="${o}"${o===fb?' selected':''}>${o}</option>`).join('')}</select></div>
      <div class="flag"><div class="txt"><b>Verbosidade</b> <span class="tag">${esc(origemEconomia('HARNESS_VERBOSITY'))}</span>
        <small>Quanto as skills <b>falam</b> durante o processo. Texto emitido é token de output <b>e vira input nos turnos seguintes</b> — é o único gasto que compõe. Nunca silencia degradação, 🔴, erro que exige decisão nem o relatório final.</small></div>
        <select id="ec_verb" onchange="mudouEconomia('HARNESS_VERBOSITY','ec_verb')">

function mudouEconomia(chave, elId){
  const v = $(elId).value;
  const destino = $('ec_destino') ? $('ec_destino').value : 'local';
  // Trocar o destino no meio do caminho nao pode deixar rastro nos dois arquivos.
  delete S.sujo.env[chave]; delete S.sujo.envLocal[chave];
  if (destino === 'projeto') S.sujo.env[chave] = v; else S.sujo.envLocal[chave] = v;
  $(elId).classList.add('sujo');
  marcarSujo();
}
function mudouRota(papel){
  S.sujo.roteamento[papel] = {
    executor: $('rt_e_'+papel).value,
    fallback: $('rt_f_'+papel).value,
  };
  $('rt_e_'+papel).classList.add('sujo');
  marcarSujo();
}

function renderHooks(){
  const d = S.dados;
  const env = d.env || {}, com = d.envComentados || {};
  // 3.5.7: valor RESOLVIDO pelas camadas + tag de origem (default do harness | projeto | máquina | ambiente) — antes
  // uma decisao ausente do harness.env aparecia como "comentada" e vazia, embora valesse o default do mestre.
  const res = d.envResolvido || {}, ori = d.envOrigem || {}, cls = d.envClasse || {};
  const ROT_ORI = {defaults:'default do harness', projeto:'projeto', local:'máquina', maquina:'máquina', ambiente:'ambiente', codigo:'default do código'};
  const controle = ([k,rot,ajuda,ops]) => {
    const v = env[k] !== undefined ? env[k] : (res[k] !== undefined ? res[k] : '');
    const o = ori[k] || (com[k] !== undefined ? 'codigo' : 'codigo');
    const tag = env[k] !== undefined && cls[k] === 'decisao' ? '<span class="tag warn">override do projeto</span>' : `<span class="tag${o==='defaults'?' ok':''}">${esc(ROT_ORI[o]||o)}</span>`;
    const campo = ops
      ? `<select id="e_${k}" onchange="mudouEnv('${k}')">${ops.map(o=>`<option value="${esc(o)}"${o===v?' selected':''}>${esc(o===''?'(vazio)':o)}</option>`).join('')}</select>`
      : `<input id="e_${k}" value="${esc(v)}" oninput="mudouEnv('${k}')">`;
    return `<div class="flag"><div class="txt"><b>${esc(k)}</b> ${tag}
      <small>${esc(rot)} — ${esc(ajuda)}${cls[k]==='decisao'?' Decisão do harness: no mestre grava em hooks/_defaults.env; num projeto vira override consciente.':''}</small></div>${campo}</div>`;
  };
  $('ab-hooks').innerHTML = `
    <div class="card"><h2>Hooks instalados e seu wiring</h2><div class="body">
      <p class="hint">O arquivo existir não basta: o hook só dispara se estiver registrado em <code>.claude/settings.json</code> (que é decisão local — o sync nunca o propaga). <code>codex-review</code>, <code>external-review</code>, <code>harness-metrics</code> e <code>harness-dashboard</code> são chamados pelas skills, não por evento.</p>
      <div class="itens">${d.hooks.map(h=>`
        <div class="item"><h4>${esc(h.arquivo)} <span class="tag ${h.origem}">${h.origem}</span></h4>
          <div class="rodape">${h.helper
            ? `<span class="tag ok">helper — chamado por skill (sem evento)</span>`
            : (h.wired
              ? h.eventos.map(e=>`<span class="tag ok">${esc(e)}</span>`).join('')
              : `<span class="tag warn">sem wiring</span>`)}</div>
        </div>`).join('')}</div>
    </div></div>
    <div class="card"><h2>Flags do harness.env</h2><div class="body">
      <p class="hint">Gravadas preservando todos os comentários do arquivo. Chave <b>comentada</b> passa a ativa ao receber valor.</p>
      ${FLAGS.map(controle).join('')}
    </div></div>
    <div class="card"><h2>Bypass de emergência</h2><div class="body"><p class="hint" style="margin:0">
      Para desligar algo pontualmente sem mexer na config, exporte no shell: <code>HARNESS_SKIP_LINT=1</code>,
      <code>HARNESS_SKIP_CODEX_REVIEW=1</code>, <code>HARNESS_SKIP_SHERLOCK=1</code>, <code>HARNESS_SKIP_MICHELANGELO=1</code>,
      <code>HARNESS_SKIP_MOCKUP=1</code>, <code>HARNESS_SKIP_DEDALO=1</code>,
      <code>HARNESS_SKIP_RAG_CAPTURE=1</code>, <code>HARNESS_SKIP_GUARD_BASH=1</code>. Lista completa no <code>harness.env</code>.
    </p></div></div>`;
}
function mudouEnv(k){ const e=$('e_'+k); S.sujo.env[k]=e.value; e.classList.add('sujo'); marcarSujo(); }

      <li>Falhou no meio: o que fechou está commitado na branch; o resto volta à fila (<code>unlock</code>). Nada produzido = nenhuma branch, nenhum MR.</li>
      <li>Telemetria no commit: <code>prds/_metrics/runs/…~noturno-*.jsonl</code> e <code>harness-duelos.jsonl</code> — o <code>/harness-report</code> mostra o que a madrugada produziu e custou.</li>
    </ul></div></div>`;
  const feitas = [1,2,3,4].filter(ntFeito).length; if ($('nt-prog')) $('nt-prog').textContent = feitas + '/4 etapas';
}

function mudouAdocao(slug, estado){
  const mapa = {};
  S.dados.convencoes.forEach(x => { mapa[x.slug] = { estado: x.slug===slug?estado:x.estado, obs: x.obs }; });
  S.dados.convencoes.forEach(x => { if (x.slug===slug) x.estado = estado; });
  S.sujo.adocao = mapa; marcarSujo(); toast(`${slug}: ${estado} — clique em Salvar`);
}
async function verConvencao(slug){
  const c = S.dados.convencoes.find(x=>x.slug===slug); if(!c) return;
  if (!S.bridge) { abrirDialogo('Convenção: '+slug, `Sem o bridge não dá para ler o arquivo. Abra ${c.arquivo} no editor.`); return; }
  try {
    const r = await fetch(`/api/file?t=${encodeURIComponent(S.token)}&path=${encodeURIComponent(c.arquivo)}`);
    const j = await r.json();

}
function portar(slug){
  const c = S.dados.convencoes.find(x=>x.slug===slug);
  abrirDialogo(`Portar "${slug}" para este projeto`,
`/convencao portar ${slug}

Cole o comando acima no Claude Code, na raiz deste projeto.

A skill lê .claude/convencoes/${slug}.md, cruza com o Perfil deste projeto
(stack, estrutura de diretórios, migrations, armadilhas locais) e monta o

da convenção. Você revisa a PRD e executa com /prd-exec.

}

// Carregada sob demanda: o /api/trabalho lê ~1400 arquivos e não tem por que
// pesar na abertura da tela.
async function carregarTrabalho(forcar){
  if (!S.bridge) { renderTrabalho(); return; }
  if (S.trabalho && !forcar) return;
  S.trabalhoCarregando = true; renderTrabalho();
  try {
    const r = await fetch('/api/trabalho?t='+encodeURIComponent(S.token), {cache:'no-store'});
    S.trabalho = await r.json();
  } catch(e){ S.trabalho = {erro:e.message}; }
  S.trabalhoCarregando = false; renderTrabalho(); renderVisao();
}
function chip(rotulo, n, ativo, onclick){
  return `<button class="b pequeno${ativo?' primary':''}" onclick="${onclick}">${esc(rotulo)} <b>${n}</b></button>`;
}
function renderTrabalho(){
  const el = $('ab-trabalho');
  if (!S.bridge) {
    el.innerHTML = `<div class="card"><div class="body"><div class="aviso">Esta aba lê os arquivos de DT e PRD do disco — precisa do bridge. Rode <code>node .claude/harness-ui.mjs</code> e abra pela URL que ele imprime.</div></div></div>`;
    return;
  }
  if (S.trabalhoCarregando) { el.innerHTML = `<div class="card"><div class="body"><p class="hint">Lendo DTs e PRDs…</p></div></div>`; return; }
  const t = S.trabalho;
  if (!t) { el.innerHTML = `<div class="card"><div class="body"><p class="hint">—</p></div></div>`; return; }
  if (t.erro) { el.innerHTML = `<div class="card"><div class="body"><div class="aviso erro">Falha ao ler: ${esc(t.erro)}</div></div></div>`; return; }

  const f = S.filtroDT;
  const dts = t.dts.itens, prds = t.prds.itens;
  const contarDT = (s) => dts.filter(d=>d.status===s).length;

  // --- próximo passo ---
  const ICONE = {'prd-exec':'▶','prd-rascunho':'◻','dt-lote':'▦','dt-alta':'▲'};
  const proximo = t.proximo.length
    ? `<div class="itens">${t.proximo.map(c=>`
        <div class="item">
          <h4>${ICONE[c.tipo]||'•'} ${esc(c.titulo)}</h4>
          <p>${esc(c.detalhe)}</p>
          <div class="rodape" style="margin-top:9px">
            <code>${esc(c.comando)}</code>
            <button class="b pequeno" onclick="copiarTexto('${esc(c.comando).replace(/'/g,"\\'")}')">Copiar</button>
          </div>
        </div>`).join('')}</div>`
    : `<div class="aviso ok">Fila limpa: nenhuma PRD aberta e nenhum DT pendente de prioridade Alta.</div>`;

  // --- divergência ---
  const div = t.dts.divergencias;
  const faixaDiv = div.length ? `
    <div class="aviso"><b>${div.length} DT(s) com status diferente entre o arquivo e o INDEX.md</b> —
      ${div.slice(0,8).map(d=>`${esc(d.id)} (arquivo: ${esc(d.arquivo)} · índice: ${esc(d.index)})`).join(' · ')}${div.length>8?' …':''}
      <div style="margin-top:8px"><button class="b pequeno" onclick="reconciliar(false)">Ver plano</button>
      <button class="b pequeno primary" onclick="reconciliar(true)">Reconciliar (o arquivo manda)</button></div>
    </div>` : '';

  // --- lista de DTs ---
  const areas = [...new Set(dts.map(d=>d.area).filter(Boolean))].sort();
  let lista = dts.filter(d =>
    (!f.status || d.status===f.status) &&
    (!f.prioridade || d.prioridade===f.prioridade) &&
    (!f.area || d.area===f.area) &&
    (!f.busca || (d.id+' '+d.titulo).toLowerCase().includes(f.busca.toLowerCase()))
  );
  lista.sort((a,b)=>{
    const pa=({'Alta':0,'Média':1,'Baixa':2})[a.prioridade] ?? 3, pb=({'Alta':0,'Média':1,'Baixa':2})[b.prioridade] ?? 3;
    return pa!==pb ? pa-pb : (a.data||'').localeCompare(b.data||'') || b.num-a.num;
  });
  const totalFiltrado = lista.length;
  const cortada = lista.slice(0, S.limiteDT);
  const linhaDT = (d) => `
    <div class="item">
      <h4>${esc(d.id)}${d.prioridade?` <span class="tag ${d.prioridade==='Alta'?'erro':d.prioridade==='Média'?'warn':''}">${esc(d.prioridade)}</span>`:''}
        ${d.soIndex?'<span class="tag">só no índice</span>':''}${d.semStatus?'<span class="tag warn">sem status</span>':''}</h4>
      <p>${esc((d.titulo||'').slice(0,150))}</p>
      <div class="rodape">
        ${d.area?`<span>${esc(d.area)}</span><span>·</span>`:''}
        ${d.data?`<span>${esc(d.data)}</span>`:''}
        ${d.esforco?`<span>· ${esc(d.esforco.slice(0,28))}</span>`:''}
      </div>
      <div class="rodape" style="margin-top:8px">
        <select style="width:auto" onchange="mudarDT('${esc(d.id)}','status',this.value)">
          ${STATUS_DT.map(s=>`<option${s===d.status?' selected':''}>${s}</option>`).join('')}
          ${STATUS_DT.includes(d.status)?'':`<option selected>${esc(d.status||'?')}</option>`}
        </select>
        <select style="width:auto" onchange="mudarDT('${esc(d.id)}','prioridade',this.value)">
          <option value="">—</option>
          ${PRIORIDADES.map(p=>`<option${p===d.prioridade?' selected':''}>${p}</option>`).join('')}
        </select>
        <button class="b pequeno" onclick="copiarTexto('/dt-exec ${esc(d.id)}')">/dt-exec</button>
      </div>
    </div>`;

  // --- lista de PRDs ---
  const prdsFiltradas = prds.filter(p => !S.filtroPRD || p.status===S.filtroPRD);
  const linhaPRD = (p) => {
    const pct = p.tasks.total ? Math.round(100*p.tasks.feitas/p.tasks.total) : 0;
    const incoerente = p.status==='Concluída' && p.tasks.total && p.tasks.feitas < p.tasks.total;
    return `<div class="item">
      <h4>${esc(p.id)} <span class="tag ${p.status==='Concluída'?'ok':p.status==='Em execução'?'warn':''}">${esc(p.status||'sem status')}</span>
        ${p.semIndex?'<span class="tag warn">fora do INDEX</span>':''}</h4>
      <p>${esc((p.titulo||'').slice(0,150))}</p>
      <div class="rodape">
        ${p.tasks.total?`<span class="tag ${incoerente?'warn':''}">${p.tasks.feitas}/${p.tasks.total} tasks (${pct}%)</span>`:'<span>sem tasks</span>'}
        ${p.data?`<span>· ${esc(p.data)}</span>`:''}
        ${p.ultimaExecucao?`<span>· última execução: ${esc(p.ultimaExecucao)}</span>`:''}
      </div>
      ${incoerente?'<p style="color:var(--warn);font-size:11.5px;margin-top:6px">Marcada como Concluída, mas há tasks não concluídas.</p>':''}
    </div>`;
  };

  el.innerHTML = `
    <div class="card"><h2>Próximo passo</h2><div class="body">
      <p class="hint">Ordem: PRD em execução → PRD em rascunho → lote de DTs pequenos da mesma área → DTs de prioridade Alta. Nada aqui é inventado: só o que já está registrado.</p>
      ${proximo}
    </div></div>
    ${faixaDiv ? `<div class="card"><h2>Divergência entre arquivo e índice</h2><div class="body">${faixaDiv}</div></div>` : ''}
    <div class="card"><h2>Sessões paralelas <span class="tag">worktrees · locks</span></h2><div class="body" id="wt-body">
      <p class="hint">Cada sessão paralela roda num <b>worktree</b> próprio (pasta irmã, branch <code>wt/&lt;rótulo&gt;</code>, banco clonado, URL própria) e os DTs/PRDs em voo ficam <b>travados</b> para as outras. O loop noturno usa o mesmo mecanismo.</p>
      <div class="rodape">
        <button class="b pequeno" onclick="carregarWorktrees()">Atualizar</button>
        <button class="b pequeno" onclick="copiarTexto('bash .claude/hooks/harness-worktree.sh novo prd-')">Copiar: novo worktree</button>
        <button class="b pequeno" onclick="copiarTexto('bash .claude/scripts/noturno.sh --dry-run')">Copiar: testar noturno</button>
      </div>
      ${S.worktrees ? renderWorktrees(S.worktrees) : ''}
    </div></div>
    <div class="card"><h2>Saneamento da fila <span class="tag">/dt-sweep</span></h2><div class="body" id="sweep-body">
      <p class="hint">Pré-classifica os DTs pendentes em ⚪ descartar · 🔵 ideia · 🟢 lote · 🔴 PRD · 🟡 decidir (heurística, sem escrever nada) e monta a fila de lotes por sessão paralela — com o comando pronto para colar. A prova e o fechamento continuam na skill.</p>
      <div class="rodape">
        <label style="margin:0">Sessões paralelas <select id="sweep-par" style="width:auto"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label>
        <button class="b pequeno primary" onclick="rodarSweep()">Pré-classificar</button>
        <button class="b pequeno" onclick="copiarTexto('/dt-sweep --paralelo='+$('sweep-par').value)">Copiar /dt-sweep</button>
      </div>
      ${S.sweep ? renderSweep(S.sweep) : ''}
    </div></div>
    <div class="card"><h2>Débitos técnicos <span class="tag">${esc(t.caminhos.dts)}</span>${t.dts.index?'':'<span class="tag warn">sem INDEX</span>'}</h2><div class="body">
      <div class="rodape" style="margin-bottom:10px">
        ${chip('Todos', dts.length, !f.status, "filtrarDT('status','')")}
        ${STATUS_DT.map(s=>chip(s, contarDT(s), f.status===s, `filtrarDT('status','${s}')`)).join('')}
      </div>
      <div class="grid" style="margin-bottom:12px">
        <div><label>Prioridade</label><select onchange="filtrarDT('prioridade',this.value)">
          <option value="">todas</option>${PRIORIDADES.map(p=>`<option${f.prioridade===p?' selected':''}>${p}</option>`).join('')}
        </select></div>
        ${areas.length?`<div><label>Área</label><select onchange="filtrarDT('area',this.value)">
          <option value="">todas</option>${areas.map(a=>`<option${f.area===a?' selected':''}>${esc(a)}</option>`).join('')}
        </select></div>`:''}
        <div><label>Busca</label><input value="${esc(f.busca)}" placeholder="id ou título" oninput="filtrarDT('busca',this.value)"></div>
      </div>
      <p class="hint">${totalFiltrado} de ${dts.length} DTs${totalFiltrado>cortada.length?` — mostrando ${cortada.length}`:''}</p>
      <div class="itens">${cortada.map(linhaDT).join('') || '<p class="hint">Nada com esse filtro.</p>'}</div>
      ${totalFiltrado>cortada.length?`<div style="margin-top:12px;text-align:center"><button class="b" onclick="S.limiteDT+=60;renderTrabalho()">Mostrar mais</button></div>`:''}
    </div></div>
    <div class="card"><h2>PRDs <span class="tag">${esc(t.caminhos.prds)}</span></h2><div class="body">
      <div class="rodape" style="margin-bottom:10px">
        ${chip('Todas', prds.length, !S.filtroPRD, "filtrarPRD('')")}
        ${['Em execução','Rascunho','Concluída'].map(s=>chip(s, prds.filter(p=>p.status===s).length, S.filtroPRD===s, `filtrarPRD('${s}')`)).join('')}
      </div>
      <div class="itens">${prdsFiltradas.slice(0,40).map(linhaPRD).join('') || '<p class="hint">Nada com esse filtro.</p>'}</div>
      ${prdsFiltradas.length>40?`<p class="hint" style="margin-top:10px">Mostrando as 40 mais recentes de ${prdsFiltradas.length}.</p>`:''}
    </div></div>`;
}
function filtrarDT(campo, valor){ S.filtroDT[campo]=valor; S.limiteDT=60; renderTrabalho(); }
function filtrarPRD(v){ S.filtroPRD=v; renderTrabalho(); }
// --- Aba Ideias (25/08 — funil de produto: semente -> refinada -> pronta -> PRD) ------------
async function carregarIdeias(){
  if (!S.bridge) { renderIdeias(); return; }
  try {
    const r = await fetch('/api/ideias?t='+encodeURIComponent(S.token), {cache:'no-store'});
    S.ideias = (await r.json()).itens || [];
  } catch(e){ S.ideias = null; }
  renderIdeias();
}
function renderIdeias(){
  const el = $('ab-ideias'); if (!el) return;
  const I = S.ideias;
  const ESTAGIOS = [
    ['semente','🌱 Sementes','capturadas no impulso — cruas de propósito'],
    ['refinada','🔧 Refinadas','já passaram pela entrevista do /ideia'],
    ['pronta-para-prd','🚀 Prontas para PRD','maduras — um /prd --ideia NNN de distância'],
  ];
  const cartao = (it) => {
    const acoes = it.id ? `
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">
        ${it.estado==='semente' ? `<button class="b" onclick="cmdIdeia('${it.id}','refinar')">Refinar…</button>` : ''}
        ${it.estado==='refinada' ? `<button class="b" onclick="mudarIdeiaEstado('${it.id}','pronta-para-prd')">Marcar pronta</button>
                                    <button class="b" onclick="cmdIdeia('${it.id}','refinar')">Refinar de novo…</button>` : ''}
        ${it.estado==='pronta-para-prd' ? `<button class="b primary" onclick="cmdIdeia('${it.id}','prd')">Virar PRD…</button>` : ''}
        ${!/descartada|virou/i.test(it.estado) ? `<button class="b" onclick="descartarIdeia('${it.id}')">Descartar</button>` : ''}
        ${/descartada/i.test(it.estado) ? `<button class="b" onclick="mudarIdeiaEstado('${it.id}','semente')">Reativar</button>` : ''}
      </div>` : `<div class="small mut" style="margin-top:6px">linha legada do índice — promova com <code>/ideia ${esc(it.titulo.slice(0,40))}…</code></div>`;
    return `<div class="card" style="margin-bottom:10px">
      <div style="display:flex;gap:8px;align-items:baseline">
        ${it.id?`<b>${it.id}</b>`:'<span class="mut">—</span>'}
        <span>${esc(it.titulo)}</span>
        <span class="spacer"></span><span class="small mut">${esc(it.data||'')}</span>
      </div>
      ${it.resumo?`<div class="small mut" style="margin-top:4px">${esc(it.resumo)}</div>`:''}
      ${acoes}
    </div>`;
  };
  const porEstado = (e) => (I||[]).filter(x => String(x.estado).toLowerCase().startsWith(e));
  const finalizadas = (I||[]).filter(x => /descartada|virou/i.test(String(x.estado)));
  el.innerHTML = `
    <div class="card">
      <b>Nova ideia</b>
      <div class="small mut" style="margin:4px 0 8px">Despeje como vier — ditado, meia frase, rascunho. Refinar é depois; capturar tem que custar zero.</div>
      <textarea id="ideiaTexto" rows="3" style="width:100%" placeholder="ex.: lembrete automático de retorno pós-procedimento pelos dados do prontuário…"></textarea>
      <div style="display:flex;gap:8px;margin-top:8px;align-items:center">
        <button class="b primary" onclick="capturarIdeiaTela()">Capturar (IDEIA-NNN)</button>
        <span class="small mut">ou numa sessão: <code>/ideia &lt;texto&gt;</code></span>
      </div>
    </div>
    ${I===null?'<div class="card">bridge indisponível — abra pela skill /harness-config</div>':''}
    ${ESTAGIOS.map(([e,rot,sub])=>`
      <h2 style="margin-top:18px">${rot} <span class="n">${porEstado(e).length}</span></h2>
      <div class="small mut" style="margin-bottom:8px">${sub}</div>
      ${porEstado(e).map(cartao).join('') || '<div class="small mut">nenhuma</div>'}`).join('')}
    <details style="margin-top:18px"><summary>Descartadas / viraram PRD (${finalizadas.length})</summary>
      ${finalizadas.map(cartao).join('') || '<div class="small mut">nenhuma</div>'}</details>`;
}
async function capturarIdeiaTela(){
  const texto = ($('ideiaTexto')||{}).value||'';
  if (!texto.trim()) { toast('Escreva a ideia primeiro'); return; }
  try {
    const r = await fetch('/api/ideias?t='+encodeURIComponent(S.token), {method:'POST',
      headers:{'content-type':'application/json'}, body: JSON.stringify({texto, origem:'tela do harness'})});
    const j = await r.json();
    toast(j.ok ? `${j.id} capturada 🌱` : 'Falhou: '+(j.avisos||[]).join(' '));
    if (j.ok) { $('ideiaTexto').value=''; carregarIdeias(); }
  } catch(e){ toast('Falha: '+e.message); }
}
async function mudarIdeiaEstado(id, estado, motivo){
  try {
    const r = await fetch('/api/ideias/estado?t='+encodeURIComponent(S.token), {method:'POST',
      headers:{'content-type':'application/json'}, body: JSON.stringify({id, estado, motivo})});
    const j = await r.json();
    toast(j.ok ? `${id} → ${j.estado}` : 'Falhou: '+(j.avisos||[]).join(' '));
    carregarIdeias();
  } catch(e){ toast('Falha: '+e.message); }
}
function descartarIdeia(id){
  const motivo = prompt(`Descartar ${id} — motivo curto (fica registrado):`);
  if (motivo === null) return;
  mudarIdeiaEstado(id, 'descartada', motivo || 'sem motivo');
}
function cmdIdeia(id, tipo){
  const n = id.replace('IDEIA-','').replace(/^0+/,'');
  const cmd = tipo==='prd' ? `/prd --ideia ${n}` : `/ideia refinar ${n}`;
  abrirDialogo(tipo==='prd' ? `Promover ${id} a PRD` : `Refinar ${id}`,
    `Cole numa sessão do projeto:\n\n${cmd}\n\n${tipo==='prd'
      ? 'A /prd nasce com a fase de produto pré-aquecida pelo refino da ideia; ao concluir, ela marca a ideia como "virou PRD-NNN".'
      : 'Entrevista de produto puro: problema/quem sofre, valor e métrica, escopo mínimo vs sonho, riscos e provocações de inovação. Nada técnico.'}`);
}

async function mudarDT(id, campo, valor){
  if (!valor) return;
  try {
    const r = await fetch('/api/trabalho/dt?t='+encodeURIComponent(S.token), {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ id, [campo]: valor }),
    });
    const j = await r.json();
    toast(j.ok ? `${id}: ${campo} → ${valor} (${j.escritos.length} arquivo(s))${j.avisos.length?' · '+j.avisos.join(' '):''}`
               : `Falhou: ${(j.avisos||[]).join(' ')}`);
    await carregarTrabalho(true);
  } catch(e){ toast('Falha: '+e.message); }
}
async function reconciliar(aplicar){
  try {
    const r = await fetch('/api/trabalho/reconciliar?t='+encodeURIComponent(S.token), {
      method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({aplicar}),
    });
    const j = await r.json();
    if (!aplicar) {
      abrirDialogo('Plano de reconciliação (nada foi gravado)',
        j.plano.length ? j.plano.map(p=>`${p.id}: ${p.acao}`).join('\n') : 'Nenhuma divergência.');
    } else {
      toast(`Reconciliado: ${j.corrigidos||0} linha(s) do índice.`);
      await carregarTrabalho(true);
    }
  } catch(e){ toast('Falha: '+e.message); }
}
async function carregarWorktrees(){
  try { const r = await fetch('/api/worktrees?t='+encodeURIComponent(S.token), {cache:'no-store'}); S.worktrees = await r.json(); }
  catch(e){ S.worktrees = {erro:e.message}; }
  renderTrabalho(); if ($('placar-duelos')) $('placar-duelos').innerHTML = renderPlacar(S.worktrees);
}
function renderPlacar(w){
  if (!w || !w.duelos || !w.duelos.total) return '<p class="hint">Nenhum duelo registrado ainda neste projeto.</p>';
  return `<table class="m"><thead><tr><th>Modelo</th><th>Duelos</th><th>Venceu</th><th>Reprovado</th><th>Inaplicável</th><th>US$</th></tr></thead><tbody>${w.duelos.porModelo.map(m=>`<tr><td>${esc(m.modelo)}</td><td>${m.n}</td><td><b>${m.v}</b> (${Math.round(100*m.v/(m.n||1))}%)</td><td>${m.rep}</td><td>${m.na}</td><td>${m.custo.toFixed(4)}</td></tr>`).join('')}</tbody></table><p class="hint">Régua: &lt; 20% de vitórias em ≥ 5 duelos ou &gt; 40% inaplicável → sai do pool (roteamento <code>placar</code>).</p>`;
}
function renderWorktrees(w){
  if (w.erro) return `<div class="aviso erro">${esc(w.erro)}</div>`;
  const at = w.atual || {};
  const wts = w.worktrees.map(x=>{const br=x.branch||'(principal)';const rot=br.startsWith('wt/')?br.slice(3):'';return `<div class="item"><h4>${esc(br)} ${x.dir===(at.dir||'')?'<span class="tag ok">esta sessão</span>':''}</h4><p><code>${esc(x.dir)}</code></p>${rot?`<div class="rodape"><button class="b pequeno" onclick="copiarTexto(${JSON.stringify('bash .claude/hooks/harness-worktree.sh fechar '+rot+' --merge').replace(/"/g,'&quot;')})">Copiar: fechar ${esc(rot)} --merge</button><small>ou diga a qualquer sessão do checkout principal: "feche o worktree ${esc(rot)} com merge"</small></div>`:''}</div>`}).join('');
  const locks = w.locks.length ? w.locks.map(l=>`<span class="tag warn">${esc(l.id)} · ${esc(l.por)}</span>`).join(' ') : '<span class="hint">nenhum lock ativo</span>';
  return `<div style="margin-top:10px"><p class="hint">Você está em: <b>${esc(at.rotulo||'principal')}</b> · banco <code>${esc(at.db||'?')}</code> · url <code>${esc(at.url||'?')}</code></p><div class="itens">${wts}</div><p style="margin-top:8px"><b>Locks:</b> ${locks}</p></div>`;
}
async function rodarSweep(){
  const par = $('sweep-par').value;
  $('sweep-body').insertAdjacentHTML('beforeend','<p class="hint" id="sweep-wait">Lendo a fila…</p>');
  try { const r = await fetch('/api/trabalho/sweep?paralelo='+par+'&t='+encodeURIComponent(S.token), {cache:'no-store'}); S.sweep = await r.json(); }
  catch(e){ S.sweep = {erro:e.message}; }
  renderTrabalho();
}
function renderSweep(sw){
  if (sw.erro) return `<div class="aviso erro">${esc(sw.erro)}</div>`;
  const ICO = {descartar:'⚪',ideia:'🔵',lote:'🟢',prd:'🔴',decidir:'🟡',harness:'🛠'};
  const NOME = {descartar:'Descartar (exige prova)',ideia:'Ideia → IDEIAS.md',lote:'Lote pequeno',prd:'PRD (agrupar por tema)',decidir:'Decidir (você)',harness:'Harness (não é DT do produto)'};
  const chips = Object.entries(sw.resumo).map(([k,v])=>`<span class="tag">${ICO[k]} ${NOME[k]}: <b>${v}</b></span>`).join(' ');
  const lista = (k) => sw.baldes[k].length ? `<details style="margin-top:8px"><summary>${ICO[k]} ${NOME[k]} (${sw.baldes[k].length})</summary><div class="itens">${sw.baldes[k].map(d=>`<div class="item"><h4>${esc(d.id)} <span class="tag">${esc(d.area)}</span>${d.prioridade?` <span class="tag">${esc(d.prioridade)}</span>`:''}</h4><p>${esc((d.titulo||'').slice(0,140))}</p><div class="rodape"><span>${esc(d.motivo)}</span>${d.idade!=null?`<span>· ${d.idade} dias</span>`:''}</div></div>`).join('')}</div></details>` : '';
  const sessoes = sw.sessoes.filter(s=>s.comando).map(s=>`<div class="item"><h4>Sessão ${s.nome} — ${s.lotes.length} lote(s): ${s.lotes.map(l=>`${esc(l.area)} (${l.dts.length})`).join(' · ')}</h4><div class="rodape" style="margin-top:8px"><code style="white-space:normal">${esc(s.comando)}</code><button class="b pequeno" onclick="copiarTexto(${JSON.stringify(s.comando).replace(/"/g,'&quot;')})">Copiar</button></div></div>`).join('');
  return `<div style="margin-top:12px"><div class="rodape">${chips}</div>
    ${['lote','prd','ideia','descartar','decidir','harness'].map(lista).join('')}
    <h3 style="margin-top:14px">Fila de lotes (${sw.lotes.length}) · ${sw.sessoes.length} sessão(ões)</h3>
    ${sessoes || '<p class="hint">Nenhum DT elegível a lote.</p>'}
    ${sw.sobra && sw.sobra.length ? `<p class="hint">Próxima rodada (teto de 5 lotes por sessão): ${sw.sobra.map(l=>`${esc(l.area)} (${l.dts.length})`).join(' · ')} — o <code>/dt-sweep --loop</code> reemite.</p>` : ''}
    <div class="rodape" style="margin-top:10px"><code>${esc(sw.prompt)}</code><button class="b pequeno primary" onclick="copiarTexto(${JSON.stringify(sw.prompt)})">Copiar prompt da skill</button>
    <small>O <code>--aplicar</code> só entra quando há ⚪/🔵/🛠 para fechar — e a skill pede confirmação antes de escrever.</small></div></div>`;
}
function copiarTexto(t){
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(()=>toast('copiado: '+t),()=>abrirDialogo('Copie',t));
  else abrirDialogo('Copie', t);
}

// ---------------------------------------------------------------------------
// Ações
// ---------------------------------------------------------------------------
async function salvar(){
  if (!S.bridge) { toast('Sem bridge — use "Copiar p/ o Claude"'); return; }
  const corpo = {};
  if (Object.keys(S.sujo.campos).length) corpo.perfilCampos = S.sujo.campos;
  if (Object.keys(S.sujo.blocos).length) corpo.perfilBlocos = S.sujo.blocos;
  if (Object.keys(S.sujo.env).length) corpo.env = S.sujo.env;
  if (S.sujo.adocao) corpo.adocao = S.sujo.adocao;
  if (Object.keys(S.sujo.envLocal).length) corpo.envLocal = S.sujo.envLocal;
  if (Object.keys(S.sujo.roteamento).length) corpo.roteamento = S.sujo.roteamento;
  // Espelha no harness.env o que a tela mudou no Perfil (as duas fontes existem
  // de proposito: o Perfil e lido pelas skills, o env pelos hooks).
  const c = S.sujo.campos;
  corpo.env = corpo.env || {};
  if (c.lint_cmd !== undefined) corpo.env.HARNESS_LINT_CMD = c.lint_cmd;
  if (c.lint_ext !== undefined) corpo.env.HARNESS_LINT_EXT = c.lint_ext;
  if (c.plat_targets !== undefined) corpo.env.HARNESS_TARGETS = c.plat_targets;
  if (c.plat_reviewer !== undefined) corpo.env.HARNESS_EXTERNAL_REVIEWER = c.plat_reviewer;
  if (c.cdx_reasoning !== undefined && ['low','medium','high'].includes(c.cdx_reasoning)) corpo.env.HARNESS_CODEX_REASONING = c.cdx_reasoning;
  if (!Object.keys(corpo.env).length) delete corpo.env;

  $('btSalvar').disabled = true;
  try {
    const r = await fetch('/api/save?t='+encodeURIComponent(S.token), {
      method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(corpo),
    });
    const j = await r.json();
    if (j.avisos && j.avisos.length) toast('Salvo com avisos: '+j.avisos.join(' | '));
    else if (j.ok) toast('Gravado: '+j.escritos.join(', ')+' (backup em .harness-run/ui-backup/'+j.ts+')');
    else toast('Nada gravado.');
    S.sujo = { campos:{}, blocos:{}, env:{}, envLocal:{}, roteamento:{}, adocao:null };
    await recarregar();
  } catch(e){ toast('Falha ao salvar: '+e.message); marcarSujo(); }
}
async function recarregar(){
  if (!S.bridge) { toast('sem bridge'); return; }
  const r = await fetch('/api/state?t='+encodeURIComponent(S.token), {cache:'no-store'});
  S.dados = await r.json(); S.preset = S.dados.preset || 'equilibrado';
  const atual = document.querySelector('#nav button.on');
  renderCabecalho(); renderNav(); renderTudo(); marcarSujo();
  if (atual) irPara(atual.dataset.aba);
}
async function rodarDoctor(){
  if (!S.bridge) { toast('Sem bridge — rode: bash .claude/harness-doctor.sh'); return; }
  irPara('visao');
  // A varredura completa leva ~20s (checa binarios, banco, CLIs). Sem contador
  // a tela parece travada.
  const t0 = Date.now();
  const tick = setInterval(()=>{ $('saidaDoctor').textContent = `rodando… ${Math.round((Date.now()-t0)/1000)}s`; }, 500);
  try {
    const r = await fetch('/api/doctor?t='+encodeURIComponent(S.token), {method:'POST'});
    const j = await r.json();
    clearInterval(tick);
    $('saidaDoctor').textContent = j.indisponivel ? 'bash não encontrado no PATH deste ambiente.' : (j.saida || '(sem saída)');
  } catch(e){ clearInterval(tick); $('saidaDoctor').textContent = 'falha: '+e.message; }
}
function abrirCopia(){
  const cfg = { versao:S.dados.versao, preset:S.preset, campos:{}, env:S.sujo.env, adocao:S.sujo.adocao||undefined };
  GRUPOS.forEach(([,cs])=>cs.forEach(([id])=>{ const e=$('f_'+id); if(e) cfg.campos[id]=e.value.trim(); }));
  MODELOS.forEach(([id])=>{ const e=$('f_'+id); if(e) cfg.campos[id]=e.value.trim(); });
  ['m_esforco','m_ciclos_beh','m_ciclos_mic','cdx_ciclos','cdx_reasoning','cdx_severity','cdx_reports','manual_mec']
    .forEach(id=>{ const e=$('f_'+id); if(e) cfg.campos[id]=e.value.trim(); });
  BLOCOS.forEach(([id])=>{ const e=$('b_'+id); if(e) cfg.campos['bloco_'+id]=e.value; });
  abrirDialogo('Aplicar via Claude',
`Aplique esta configuração do harness. Edite \`.claude/PERFIL-PROJETO.md\` e \`.claude/harness.env\`
CAMPO A CAMPO (edição cirúrgica — nunca regenere os arquivos), usando os ids abaixo, que batem
com o PERFIL_MAP do \`.claude/harness-ui.mjs\`. Depois rode \`bash .claude/harness-doctor.sh\`.

\`\`\`json
${JSON.stringify(cfg, null, 2)}
\`\`\``);
}
function abrirDialogo(titulo, texto){ $('dlgTitulo').textContent=titulo; $('dlgTexto').value=texto; $('dlg').showModal(); }
function copiarDialogo(){
  const t = $('dlgTexto').value;
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(()=>toast('copiado'),()=>{ $('dlgTexto').select(); document.execCommand('copy'); toast('copiado'); });
  else { $('dlgTexto').select(); document.execCommand('copy'); toast('copiado'); }
}

boot();
</script>
