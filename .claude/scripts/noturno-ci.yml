# .claude/scripts/noturno-ci.yml (harness 3.4.1) — JOB AGENDADO do loop noturno de DTs, independente do PC
# de qualquer dev. Cole no .gitlab-ci.yml do projeto (ou inclua via `include: local:`), crie uma
# Pipeline Schedule (CI/CD > Schedules) para ~01:30 com a variavel NOTURNO=1, e declare as CI
# variables (Settings > CI/CD > Variables, masked/protected):
#   CLAUDE_CODE_OAUTH_TOKEN   token da assinatura (rode `claude setup-token` uma vez)  — ou ANTHROPIC_API_KEY
#   OPENROUTER_API_KEY        workers + juiz baratos (teto diario pelo harness.env)
#   HARNESS_DB_EXT_HOST / HARNESS_DB_EXT_USER / HARNESS_DB_EXT_PASS / HARNESS_DB_EXT_NAME
#                             banco do noturno (ex.: <db>_noturno recriado toda noite — .claude/scripts/noturno-db-clone.sh)
#   HARNESS_URL_EXT           (opcional) URL do app apontando para esse banco, se houver E2E
#   GITLAB_TOKEN              (opcional, scope api) para abrir o MR automaticamente
# O job NUNCA toca a branch principal: commita em wt/noturno-<data> e abre MR.

noturno:
  stage: test            # qualquer stage que NAO faca deploy
  image: node:22-bookworm
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NOTURNO == "1"'
  timeout: 3h
  variables:
    GIT_DEPTH: "0"                       # historico completo: o sweep usa git log -S para provar descarte
    HARNESS_NOTURNO_MAX_LOTES: "3"
    HARNESS_DUELO_JUIZ_CLOUD: "openrouter"   # o Claude do runner so orquestra; juiz barato
    HARNESS_DELEGATE_MODE: "off"             # sem Codex no runner
  before_script:
    # runtime do projeto (ajuste ao stack: php para projetos PHP, mysql-client para o smoke/provas)
    - apt-get update -qq && apt-get install -y -qq git curl default-mysql-client php-cli php-mysql > /dev/null
    - npm i -g @anthropic-ai/claude-code@latest
    - git remote set-url origin "https://oauth2:${GITLAB_TOKEN:-$CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git fetch -q origin && git checkout -q "$CI_COMMIT_REF_NAME"
  script:
    - bash .claude/scripts/noturno.sh --cloud --paralelo 1 --max-lotes "$HARNESS_NOTURNO_MAX_LOTES"
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - .claude/.harness-run/noturno-*.log
      - prds/_metrics/duelos/
      - prds/_metrics/delegations/
