<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terna</title>
  <meta name="description" content="Terna: jogo de plataforma e luta 2D em pixel art. Escolha a Leslie ou o Grow e lute na Floresta da Divisa, sozinho ou online.">
  <meta name="theme-color" content="#1b1b24">
  <!-- O ícone do site (ferramentas/gerar-icone.cjs): o cristal da logo numa ilhazinha. -->
  <link rel="icon" href="/icone.svg" type="image/svg+xml">
  <link rel="icon" href="/icone-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/icone-180.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Terna">
  <!-- Como o link aparece quando é compartilhado (WhatsApp, Discord, redes). -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Terna">
  <meta property="og:description" content="Jogo de plataforma e luta 2D em pixel art. Escolha a Leslie ou o Grow e lute na Floresta da Divisa.">
  <meta property="og:locale" content="pt_BR">
  <style>
    /* A página nunca rola (nem mostra a barra do navegador): o que não cabe rola dentro das
       telas do jogo, com a barra no jeito dele (inicio.css). */
    html, body { margin: 0; height: 100%; background: #1b1b24; overflow: hidden; overscroll-behavior: none; }
    body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
    /* A tela do jogo: o canvas e, por cima, o que é HTML dentro da partida (a engrenagem). */
    #tela {
      position: relative;
      width: 100vw;
      max-width: calc(100vh * 16 / 9);
      aspect-ratio: 16 / 9;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }
    /* Só o canvas da partida fica sem seta: nele o cursor vira a mira (interface/mira.ts). Os
       canvas das telas (sprites, ícones, o mapa) mantêm o cursor. */
    #jogo { cursor: none; }
    #hud { position: absolute; inset: 0; pointer-events: none; }
    #hud > * { pointer-events: auto; }
  </style>
</head>
<body>
  <div id="tela">
    <canvas id="jogo" width="480" height="270"></canvas>
    <div id="hud"></div>
  </div>
  <div id="inicio"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
